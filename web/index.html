<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>AI Phone</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="app">
    <!-- Login -->
    <section id="login" class="screen" hidden>
      <h1>AI Phone</h1>
      <form id="login-form">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="btn primary">Sign in</button>
        <p id="login-error" class="error" hidden>Wrong password</p>
      </form>
    </section>

    <!-- Phone -->
    <section id="phone" class="screen" hidden>
      <div id="sound-banner" class="banner" hidden>Tap anywhere to turn on ringing</div>

      <div class="contact">
        <div id="avatar" class="avatar"><span id="avatar-letter">A</span></div>
        <h1 id="ai-name">Assistant</h1>
        <p id="status" class="status">Ready</p>
        <p id="timer" class="timer" hidden>0:00</p>
        <p id="reason" class="reason" hidden></p>
      </div>

      <div id="transcript" class="transcript" aria-live="polite"></div>

      <div class="controls">
        <!-- idle -->
        <button id="call-btn" class="round green" title="Call">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        </button>
        <!-- incoming -->
        <button id="decline-btn" class="round red" title="Decline" hidden>
          <svg viewBox="0 0 24 24" class="hang"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        </button>
        <button id="accept-btn" class="round green pulse" title="Accept" hidden>
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        </button>
        <!-- in call -->
        <button id="mute-btn" class="round gray" title="Mute" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        </button>
        <button id="hangup-btn" class="round red" title="Hang up" hidden>
          <svg viewBox="0 0 24 24" class="hang"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        </button>
      </div>
    </section>
  </main>
  <audio id="remote-audio" autoplay playsinline></audio>
  <script src="/static/sounds.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
